<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dr. ChatterMate — Hospital Management</title>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%2310b981' d='M12 2a4 4 0 0 1 4 4v2h2a4 4 0 0 1 4 4v2h-4v2a4 4 0 0 1-4 4h-2v-4h-2a4 4 0 0 1-4-4v-2H2v-2a4 4 0 0 1 4-4h2V6a4 4 0 0 1 4-4z'/></svg>" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path fill="#10b981" d="M11 2h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
      </svg>
      <div>
        <div class="brand-name">Dr. ChatterMate</div>
        <div class="brand-sub">Hospital OS</div>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="Primary"></nav>
    <div class="sidebar-foot">
      <div class="sim-badge">Cash · Card · bKash</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn mobile-only" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <span id="aiStatus" class="pill pill-muted">AI: checking…</span>
        <span class="pill pill-ok">● Live</span>
      </div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <header><h3 id="modalTitle">Dialog</h3>
      <button class="icon-btn" data-close-modal aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18.3 5.71 12 12.01l-6.29-6.3-1.42 1.42L10.59 13.42 4.29 19.71l1.42 1.42L12 14.83l6.29 6.3 1.42-1.42-6.3-6.29 6.3-6.3z"/></svg>
      </button>
    </header>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/patients.js"></script>
<script src="/js/doctors.js"></script>
<script src="/js/visits.js"></script>
<script src="/js/laboratory.js"></script>
<script src="/js/billing.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/assistant.js"></script>
<script src="/js/settings.js"></script>
<script>App.start();</script>
</body>
</html>
